# docs/ops-mcp.md Helm block with the existingSecret option and the :dev tag.
# create: false because the namespace already holds the token Secret (doc gap).
mcp:
  enabled: true
  namespace:
    name: kafscale-mcp
    create: false
  image: {tag: dev}
  auth:
    existingSecret: kafscale-mcp-token
    existingSecretKey: mcp-token
  etcdEndpoints:
    - "http://demo-etcd-client.kafscale.svc.cluster.local:2379"
  metrics:
    brokerMetricsURL: "http://demo-broker.kafscale.svc.cluster.local:9093/metrics"
  sessionTimeout: 10m
