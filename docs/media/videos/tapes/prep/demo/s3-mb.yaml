apiVersion: batch/v1
kind: Job
metadata:
  name: s3-mb
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: s3-mb
          image: amazon/aws-cli:2.15.0
          args:
            - s3
            - mb
            - s3://kafscale-demo
            - --endpoint-url
            - http://minio.kafscale.svc:9000
          envFrom:
            - secretRef:
                name: kafscale-s3
          env:
            - name: AWS_DEFAULT_REGION
              value: us-east-1
