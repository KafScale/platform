server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 100m;
    location / { try_files $uri $uri/ =404; }
    location /lfs/ {
        proxy_pass http://proxy:8080;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
