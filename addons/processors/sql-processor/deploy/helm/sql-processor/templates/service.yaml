{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sql-processor.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "sql-processor.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- with .Values.service.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: pgwire
      port: {{ .Values.service.port }}
      targetPort: pgwire
      protocol: TCP
  selector:
{{ include "sql-processor.executorSelector" . | indent 4 }}
{{- end }}
