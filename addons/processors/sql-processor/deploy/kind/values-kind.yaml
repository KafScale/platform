fullnameOverride: kafsql

envFromSecret: sql-s3-credentials

env:
  - name: KAFSQL_S3_BUCKET
    value: kafscale-snapshots
  - name: KAFSQL_S3_NAMESPACE
    value: kafscale-demo
  - name: KAFSQL_S3_REGION
    value: us-east-1
  - name: KAFSQL_S3_ENDPOINT
    value: http://minio.kafscale-demo.svc.cluster.local:9000
  - name: KAFSQL_S3_PATH_STYLE
    value: "true"
  - name: KAFSQL_METADATA_DISCOVERY
    value: etcd
  - name: KAFSQL_METADATA_ETCD_ENDPOINTS
    value: http://kafscale-etcd-client.kafscale-demo.svc.cluster.local:2379

service:
  enabled: true
  type: ClusterIP
  port: 5432
  targetPort: 5432
