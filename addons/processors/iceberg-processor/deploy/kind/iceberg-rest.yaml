apiVersion: apps/v1
kind: Deployment
metadata:
  name: iceberg-rest
  namespace: kafscale-demo
  labels:
    app: iceberg-rest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iceberg-rest
  template:
    metadata:
      labels:
        app: iceberg-rest
    spec:
      containers:
        - name: iceberg-rest
          image: tabulario/iceberg-rest:1.6.0
          env:
            - name: CATALOG_WAREHOUSE
              value: s3://kafscale-snapshots/iceberg
            - name: CATALOG_IO__IMPL
              value: org.apache.iceberg.aws.s3.S3FileIO
            - name: CATALOG_S3_ENDPOINT
              value: http://minio.kafscale-demo.svc.cluster.local:9000
            - name: CATALOG_S3_PATH__STYLE__ACCESS
              value: "true"
            - name: CATALOG_S3_REGION
              value: us-east-1
            - name: AWS_REGION
              value: us-east-1
            - name: CATALOG_S3_ACCESS__KEY__ID
              valueFrom:
                secretKeyRef:
                  name: iceberg-s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: CATALOG_S3_SECRET__ACCESS__KEY
              valueFrom:
                secretKeyRef:
                  name: iceberg-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
          ports:
            - name: http
              containerPort: 8181
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: iceberg-rest
  namespace: kafscale-demo
spec:
  selector:
    app: iceberg-rest
  ports:
    - name: http
      port: 8181
      targetPort: http
