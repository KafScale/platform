fullnameOverride: iceberg-processor

s3:
  credentialsSecretRef: iceberg-s3-credentials

config:
  s3:
    bucket: kafscale-snapshots
    namespace: kafscale-demo
    region: us-east-1
    endpoint: http://minio.kafscale-demo.svc.cluster.local:9000
    path_style: true
  iceberg:
    catalog:
      type: rest
      uri: http://iceberg-rest.kafscale-demo.svc.cluster.local:8181
      token: ""
      username: ""
      password: null
    warehouse: s3://kafscale-snapshots/iceberg
  offsets:
    backend: etcd
    lease_ttl_seconds: 30
    key_prefix: processors
  processor:
    poll_interval_seconds: 1
  discovery:
    mode: s3
  etcd:
    endpoints:
      - http://kafscale-etcd-client.kafscale-demo.svc.cluster.local:2379
    username: ""
    password: null
  schema:
    mode: "off"
    registry:
      base_url: ""
      timeout_seconds: 5
      cache_seconds: 300
  mappings:
    - topic: demo-topic-1
      table: demo.demo_topic_1
      mode: append
      create_table_if_missing: true
      schema:
        source: none
