{{- if and .Values.schemaRegistry.enabled .Values.schemaRegistry.podDisruptionBudget.enabled (gt (int .Values.schemaRegistry.replicas) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kafscale.componentName" (dict "root" . "component" "schema-registry") }}
  labels:
{{ include "kafscale.labels" . | indent 4 }}
    app.kubernetes.io/component: schema-registry
spec:
  maxUnavailable: {{ .Values.schemaRegistry.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
{{ include "kafscale.componentSelectorLabels" (dict "root" . "component" "schema-registry") | indent 6 }}
{{- end }}
