{{- if .Values.schemaRegistry.enabled }}
{{- if not .Values.schemaRegistry.etcdEndpoints }}
{{- fail "schemaRegistry.etcdEndpoints is required" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kafscale.componentName" (dict "root" . "component" "schema-registry") }}
  labels:
{{ include "kafscale.labels" . | indent 4 }}
    app.kubernetes.io/component: schema-registry
spec:
  replicas: {{ .Values.schemaRegistry.replicas }}
  selector:
    matchLabels:
{{ include "kafscale.componentSelectorLabels" (dict "root" . "component" "schema-registry") | indent 6 }}
  template:
    metadata:
      labels:
{{ include "kafscale.componentSelectorLabels" (dict "root" . "component" "schema-registry") | indent 8 }}
{{- with .Values.schemaRegistry.podAnnotations }}
      annotations:
{{ toYaml . | indent 8 }}
{{- end }}
    spec:
{{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{- range .Values.imagePullSecrets }}
        - name: {{ . }}
{{- end }}
{{- end }}
{{- with .Values.schemaRegistry.podSecurityContext }}
      securityContext:
{{ toYaml . | indent 8 }}
{{- end }}
      containers:
        - name: schema-registry
          image: "{{ .Values.schemaRegistry.image.repository }}:{{ ternary "latest" (default .Chart.AppVersion .Values.schemaRegistry.image.tag) .Values.schemaRegistry.image.useLatest }}"
          imagePullPolicy: {{ ternary "Always" .Values.schemaRegistry.image.pullPolicy .Values.schemaRegistry.image.useLatest }}
{{- with .Values.schemaRegistry.containerSecurityContext }}
          securityContext:
{{ toYaml . | indent 12 }}
{{- end }}
          env:
            - name: KAFSCALE_SCHEMA_REGISTRY_ADDR
              value: ":{{ .Values.schemaRegistry.port }}"
            - name: KAFSCALE_SCHEMA_REGISTRY_ETCD_ENDPOINTS
              value: "{{ join "," .Values.schemaRegistry.etcdEndpoints }}"
{{- if .Values.schemaRegistry.etcd.existingSecret }}
            - name: KAFSCALE_SCHEMA_REGISTRY_ETCD_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.schemaRegistry.etcd.existingSecret }}
                  key: ETCD_USERNAME
            - name: KAFSCALE_SCHEMA_REGISTRY_ETCD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.schemaRegistry.etcd.existingSecret }}
                  key: ETCD_PASSWORD
{{- end }}
{{- if .Values.schemaRegistry.requestTimeout }}
            - name: KAFSCALE_SCHEMA_REGISTRY_REQUEST_TIMEOUT
              value: "{{ .Values.schemaRegistry.requestTimeout }}"
{{- end }}
{{- if .Values.schemaRegistry.inlineLimitBytes }}
            - name: KAFSCALE_SCHEMA_REGISTRY_INLINE_LIMIT_BYTES
              value: "{{ .Values.schemaRegistry.inlineLimitBytes }}"
{{- end }}
{{- with .Values.schemaRegistry.s3 }}
{{- if .bucket }}
            - name: KAFSCALE_S3_BUCKET
              value: "{{ .bucket }}"
            - name: KAFSCALE_S3_REGION
              value: "{{ .region }}"
            - name: KAFSCALE_S3_NAMESPACE
              value: "{{ .namespace }}"
{{- if .endpoint }}
            - name: KAFSCALE_S3_ENDPOINT
              value: "{{ .endpoint }}"
{{- end }}
{{- if .pathStyle }}
            - name: KAFSCALE_S3_PATH_STYLE
              value: "true"
{{- end }}
{{- if .credentialsSecret }}
            - name: KAFSCALE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .credentialsSecret }}
                  key: AWS_ACCESS_KEY_ID
            - name: KAFSCALE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .credentialsSecret }}
                  key: AWS_SECRET_ACCESS_KEY
{{- end }}
{{- end }}
{{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.schemaRegistry.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
{{- if .Values.schemaRegistry.resources }}
{{ toYaml .Values.schemaRegistry.resources | indent 12 }}
{{- else }}
            {}
{{- end }}
{{- with .Values.schemaRegistry.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.schemaRegistry.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.schemaRegistry.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
{{- end }}
{{- end }}
