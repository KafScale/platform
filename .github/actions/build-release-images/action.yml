name: Build release images
description: Build every release image from the shared bake plan and push it when publish is true.

inputs:
  publish:
    description: Push images to GHCR when "true".
    required: true

runs:
  using: composite
  steps:
    - name: Set up QEMU for release platforms
      if: inputs.publish == 'true'
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      with:
        buildkitd-config-inline: |
          [worker.oci]
            max-parallelism = 2
    - name: Log in to GHCR
      if: inputs.publish == 'true'
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Prepare shared build plan
      shell: bash
      env:
        PUBLISH_IMAGES: ${{ inputs.publish }}
        RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.0.0-ci' }}
        SOURCE_REVISION: ${{ github.sha }}
      run: bash scripts/build_release_images.sh --print > "$RUNNER_TEMP/release-images.json"
    - name: Build all release images
      uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
      with:
        source: .
        files: ${{ runner.temp }}/release-images.json
        push: ${{ inputs.publish }}
    - name: Download generated release Compose
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: release-assets
        path: dist/release
    - name: Smoke-test generated Compose with candidate images and provisioned S3
      shell: bash
      run: bash scripts/test_release_compose.sh dist/release/docker-compose.yaml
