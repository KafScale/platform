name: Build release images

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        required: true

jobs:
  images:
    name: Release image builds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          persist-credentials: false
      - name: Set up QEMU for release platforms
        if: inputs.publish
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare shared build plan
        env:
          PUBLISH_IMAGES: ${{ inputs.publish }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_REVISION: ${{ github.sha }}
        run: bash scripts/build_release_images.sh --print > "$RUNNER_TEMP/release-images.json"
      - name: Build all release images
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        with:
          source: .
          files: ${{ runner.temp }}/release-images.json
          push: ${{ inputs.publish }}
