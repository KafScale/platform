name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  license-check:
    name: License Header Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - name: Validate Apache 2.0 headers
        run: python3 hack/check_license_headers.py

  go-test:
    name: Go Test Suite
    runs-on: ubuntu-latest
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            addons/processors/skeleton/go.sum
            addons/processors/sql-processor/go.sum
            addons/processors/iceberg-processor/go.sum

      - name: Prepare Go build cache
        run: mkdir -p "$GOCACHE"

      - name: Run go vet ./...
        run: go vet ./...

      - name: Run go test -race ./...
        run: go test -race ./...

      - name: Require 100% authentication coverage
        run: bash hack/check_auth_coverage.sh

      - name: Kafka mTLS end-to-end test
        env:
          KAFSCALE_E2E_AUTH: "1"
        run: go test -race -tags=e2e ./test/e2e -run '^TestProxyMTLSE2E$' -v -count=1 -timeout=3m

      - name: CRD and security reconciliation API tests
        env:
          KAFSCALE_E2E_AFFINITY: "1"
          KAFSCALE_E2E_AUTH: "1"
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@f52bbb8bb1a2275cbe90dec8d6c12d5cacb1a7de
          KUBEBUILDER_ASSETS="$("$(go env GOPATH)/bin/setup-envtest" use -p path 1.35.0)"
          export KUBEBUILDER_ASSETS
          go test -race -tags=e2e ./pkg/operator -run '^Test(AffinityOverridesAPI|KafkaSecurityAPI)$' -v -count=1 -timeout=2m

      - name: Run nested module tests
        run: make test-nested-modules

  go-coverage:
    name: Go Coverage Gate
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.summary.outputs.total }}
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Prepare Go build cache
        run: mkdir -p "$GOCACHE"

      - name: Enforce coverage floor
        shell: bash
        run: bash hack/check_coverage.sh 85 | tee coverage.txt

      - name: Write coverage summary
        id: summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
            {
              echo "## Go coverage"
              echo ""
              echo "Total statement coverage (gated packages): **${total}**"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "total=${total%\%}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage.txt
          if-no-files-found: ignore

  coverage-badge:
    name: Coverage Badge
    needs: go-coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Commit badges/coverage.json to gh-pages
        env:
          TOTAL: ${{ needs.go-coverage.outputs.coverage }}
        run: |
          if [ -z "$TOTAL" ]; then
            echo "No coverage total from the coverage job." >&2
            exit 1
          fi
          color=red
          if awk -v t="$TOTAL" 'BEGIN { exit !(t >= 80) }'; then
            color=brightgreen
          elif awk -v t="$TOTAL" 'BEGIN { exit !(t >= 60) }'; then
            color=yellow
          fi
          mkdir -p badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$TOTAL" "$color" > badges/coverage.json
          git add badges/coverage.json
          if git diff --cached --quiet; then
            echo "Coverage badge unchanged at ${TOTAL}%."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Coverage badge: ${TOTAL}%"
          for _ in 1 2 3; do
            if git push origin HEAD:gh-pages; then
              exit 0
            fi
            git pull -q --rebase origin gh-pages
          done
          echo "Could not push the coverage badge to gh-pages." >&2
          exit 1


  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Lint chart
        run: helm lint deploy/helm/kafscale

      - name: Chart conformance tests
        run: |
          make test-chart-proxy-nodeport
          make test-chart-psa
          make test-chart-antiaffinity
          make test-chart-mtls

  operator-restricted:
    name: Operator Restricted Workloads
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build runtime images
        run: |
          make docker-build-broker docker-build-etcd-tools docker-build-e2e-client docker-build-proxy \
            BROKER_IMAGE=kafscale-broker:security \
            ETCD_TOOLS_IMAGE=kafscale-etcd-tools:security \
            E2E_CLIENT_IMAGE=kafscale-e2e-client:security \
            PROXY_IMAGE=kafscale-proxy:security
      - name: Build pinned MinIO test fixture
        run: docker build -t kafscale-minio:security -f test/e2e/minio.Dockerfile .
      - name: Create Kubernetes 1.35 test cluster
        run: |
          go install sigs.k8s.io/kind@v0.31.0
          kind create cluster --name kafscale-security --wait 180s \
            --image kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
          kind load docker-image --name kafscale-security \
            kafscale-broker:security kafscale-etcd-tools:security kafscale-e2e-client:security kafscale-proxy:security kafscale-minio:security
      - name: Exercise restricted workloads and root-owned PVC upgrade
        env:
          KAFSCALE_E2E_KIND_SECURITY: "1"
          KAFSCALE_SECURITY_CONTEXT: kind-kafscale-security
        run: go test -tags=e2e ./pkg/operator -run '^TestRestrictedWorkloadsKind$' -v -count=1 -timeout=20m
      - name: Delete test cluster
        if: always()
        run: kind delete cluster --name kafscale-security
